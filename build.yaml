---
include:
#  - board: eyelash_corne_left
#    shield: nice_view
#    #snippet: zmk-usb-logging    # Uncomment to log over USB.
  - board: eyelash_corne_right
    shield: nice_view_custom
    #snippet: zmk-usb-logging
  - board: eyelash_corne_left
    shield: nice_view_custom raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
    #snippet: zmk-usb-logging
 
  - board: eyelash_corne_left
    shield: nice_view_custom raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_FOXGLOVE_TEST_HOOKS=n
    artifact-name: eyelash_corne_studio_left_ga
  - board: eyelash_corne_right
    shield: nice_view_custom
    cmake-args: -DCONFIG_FOXGLOVE_TEST_HOOKS=n
    artifact-name: eyelash_corne_right_ga
  - board: eyelash_corne_left
    shield: nice_view_custom raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_FOXGLOVE_LAMPARRAY=y -DCONFIG_FOXGLOVE_LAMPARRAY_BLE=y -DCONFIG_USB_HID_DEVICE_COUNT=3
    artifact-name: eyelash_corne_studio_left_lamparray
